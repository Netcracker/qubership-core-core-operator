MEM_ARGS: >-
  -XX:+UseSerialGC -Xms32m -Xmx96m -Xss256k
  -XX:MetaspaceSize=64m -XX:MaxMetaspaceSize=128m -XX:CompressedClassSpaceSize=32m
  -XX:MinMetaspaceExpansion=1m -XX:MaxMetaspaceExpansion=8m
  -XX:MaxDirectMemorySize=10m -XX:ReservedCodeCacheSize=32m -XX:CodeCacheExpansionSize=256k
  -XX:MinHeapFreeRatio=20 -XX:MaxHeapFreeRatio=40
MEMORY_LIMIT: "380Mi"
CPU_REQUEST: "100m"
CPU_LIMIT: "1"
REPLICAS: 2
HPA_ENABLED: false
HPA_AVG_CPU_UTILIZATION_TARGET_PERCENT: 75
HPA_SCALING_UP_STABILIZATION_WINDOW_SECONDS: 60
HPA_SCALING_UP_PODS_PERIOD_SECONDS: 60
HPA_SCALING_UP_PODS_VALUE: 1
HPA_SCALING_DOWN_STABILIZATION_WINDOW_SECONDS: 300
HPA_SCALING_DOWN_PODS_PERIOD_SECONDS: 60
HPA_SCALING_DOWN_PODS_VALUE: 1
HPA_MIN_REPLICAS: 2
HPA_MAX_REPLICAS: 5
HPA_SCALING_UP_SELECT_POLICY: Max
HPA_SCALING_DOWN_SELECT_POLICY: Max
HPA_SCALING_UP_PERCENT_PERIOD_SECONDS: -1
HPA_SCALING_DOWN_PERCENT_PERIOD_SECONDS: -1