name: Cleanup old Docker images

on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Print the versions that would be deleted without deleting them"
        type: boolean
        default: true
      debug:
        description: "Print debug logs of the cleanup action"
        type: boolean
        default: false

permissions: {}

jobs:
  cleanup:
    permissions:
      contents: read
    uses: netcracker/qubership-core-infra/.github/workflows/docker-cleanup.yaml@772e4681543063e9516421256584a01ad7034477 # feat/docker-cleanup-poc
    with:
      dry-run: ${{ inputs.dry-run }}
      debug: ${{ inputs.debug }}
    secrets:
      GH_RWD_PACKAGE_TOKEN: ${{ secrets.GH_RWD_PACKAGE_TOKEN }}
